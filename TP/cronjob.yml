apiVersion: batch/v1
kind: CronJob
metadata:
  name: date
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: date
            image: busybox:latest
            command:
            - /bin/sh
            - -c
            - date
          restartPolicy: OnFailure
